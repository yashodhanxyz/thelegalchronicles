<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171713" />
    <title>The Legal Chronicles — Coming Soon</title>
    <meta
      name="description"
      content="The Legal Chronicles is coming soon."
    />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DG0860K5DH"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-DG0860K5DH");
    </script>
    <style>
      :root {
        color-scheme: dark;
        --ink: #171713;
        --paper: #f3efe6;
        --muted: #b8b3a8;
        --line: rgba(243, 239, 230, 0.18);
        --accent: #c8a969;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background:
          radial-gradient(circle at 82% 18%, rgba(200, 169, 105, 0.1), transparent 30rem),
          var(--ink);
        color: var(--paper);
        font-family: Georgia, "Times New Roman", serif;
      }

      main {
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        grid-template-rows: auto 1fr auto;
        padding: clamp(1.5rem, 4vw, 4rem);
      }

      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
      }

      .wordmark,
      .status,
      footer {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .wordmark {
        margin: 0;
        font-weight: 600;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--muted);
      }

      .status::before {
        width: 0.42rem;
        height: 0.42rem;
        border-radius: 50%;
        background: var(--accent);
        content: "";
        box-shadow: 0 0 0 0.22rem rgba(200, 169, 105, 0.12);
      }

      .hero {
        align-self: center;
        max-width: 62rem;
        padding: clamp(4rem, 12vh, 9rem) 0;
      }

      h1 {
        max-width: 12ch;
        margin: 0;
        font-size: clamp(3.7rem, 10vw, 9rem);
        font-weight: 400;
        letter-spacing: -0.055em;
        line-height: 0.88;
        text-wrap: balance;
      }

      .intro {
        max-width: 34rem;
        margin: clamp(2rem, 5vw, 3.5rem) 0 0;
        color: var(--muted);
        font-family: Arial, Helvetica, sans-serif;
        font-size: clamp(1rem, 1.6vw, 1.2rem);
        line-height: 1.65;
      }

      footer {
        border-top: 1px solid var(--line);
        padding-top: 1.25rem;
        color: var(--muted);
      }

      footer p {
        margin: 0;
      }

      .footer-meta,
      .social-links {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .social-links {
        gap: 0.8rem;
      }

      .social-links::before {
        color: var(--line);
        content: "/";
      }

      .social-links a {
        color: var(--paper);
        text-decoration: none;
        text-underline-offset: 0.25em;
      }

      .social-links a:hover,
      .social-links a:focus-visible {
        color: var(--accent);
        text-decoration: underline;
      }

      .social-links a:focus-visible {
        border-radius: 0.1rem;
        outline: 2px solid var(--accent);
        outline-offset: 0.25rem;
      }

      @media (max-width: 38rem) {
        header,
        footer {
          align-items: flex-start;
          flex-direction: column;
        }

        .footer-meta {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.75rem;
        }

        .social-links::before {
          display: none;
        }

        h1 {
          font-size: clamp(3.35rem, 18vw, 5rem);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header aria-label="Site header">
        <p class="wordmark">The Legal Chronicles</p>
        <span class="status">In development</span>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title">Law has a story.</h1>
        <p class="intro">
          The Legal Chronicles is preparing a new home for thoughtful legal
          stories, perspectives, and ideas. We’ll be here soon.
        </p>
      </section>

      <footer>
        <p>© 2026 The Legal Chronicles</p>
        <div class="footer-meta">
          <p>Independent legal publishing</p>
          <nav class="social-links" aria-label="Social media">
            <a
              href="https://x.com/legalchronicle_"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="The Legal Chronicles on X"
            >X</a>
            <a
              href="https://www.linkedin.com/company/thelegalchronicles/"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="The Legal Chronicles on LinkedIn"
            >LinkedIn</a>
          </nav>
        </div>
      </footer>
    </main>
  </body>
</html>
